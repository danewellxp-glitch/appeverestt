<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Everest Desafio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: palco em 3 colunas (telas | celular | rota e API). O app inteiro vive dentro do celular. */
:root{
  --bg:#f7f6f6; --surface:#ffffff; --surface-2:#efecec; --line:#e1dcdc;
  --fg:#141111; --muted:#5e5757;
  --red:#dc2626; --red-text:#c21d1d; --orange:#f97316; --on-red:#ffffff;
  --pop-bg:#141111; --pop-fg:#ffffff; --pop-muted:#b8b0b0; --pop-track:#3a3131;
  --stage:#e9e5e5; --frame:#151111; --scrim:rgba(20,8,8,.45);
  --shadow:0 40px 90px -40px rgba(60,10,10,.45);
  --font-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#110e0e; --surface-2:#1e1919; --line:#2d2626;
    --fg:#ffffff; --muted:#a9a1a1;
    --red:#dc2626; --red-text:#f05252; --orange:#fb7a2d; --on-red:#ffffff;
    --pop-bg:#f4f1f1; --pop-fg:#141111; --pop-muted:#5e5757; --pop-track:#dcd5d5;
    --stage:#0b0808; --frame:#1f1919; --scrim:rgba(0,0,0,.62);
    --shadow:0 40px 90px -40px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#110e0e; --surface-2:#1e1919; --line:#2d2626;
  --fg:#ffffff; --muted:#a9a1a1;
  --red:#dc2626; --red-text:#f05252; --orange:#fb7a2d; --on-red:#ffffff;
  --pop-bg:#f4f1f1; --pop-fg:#141111; --pop-muted:#5e5757; --pop-track:#dcd5d5;
  --stage:#0b0808; --frame:#1f1919; --scrim:rgba(0,0,0,.62);
  --shadow:0 40px 90px -40px rgba(0,0,0,.9);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--stage);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--red-text);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html.theming,html.theming *{transition:background-color .35s ease,color .35s ease,border-color .35s ease,box-shadow .35s ease!important}
h1,h2,h3,p{margin:0}
.ic{width:20px;height:20px;flex:none}
.ic.xs{width:13px;height:13px}
.ic.sm{width:16px;height:16px}
.ic.lg{width:24px;height:24px}

/* ---------- Palco ---------- */
.stage{display:grid;grid-template-columns:230px auto minmax(260px,320px);gap:32px;justify-content:center;align-items:start;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:24px;display:grid;gap:18px;min-width:0}
.proj{display:grid;gap:6px}
.proj .brandline{display:flex;align-items:center;gap:8px;color:var(--red-text)}
.proj h1{font-family:var(--font-display);font-weight:900;font-size:38px;line-height:.9;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.proj p{color:var(--muted);font-size:13px}
.screens{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.screens .grp{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px 10px}
.screens button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:10px;font-size:14px}
.screens button span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;width:18px;flex:none}
.screens button:hover{background:var(--surface-2)}
.screens button[aria-current="true"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
.screens button[aria-current="true"] span{color:var(--red-text)}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px 10px;font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center;justify-content:center;color:var(--muted);transition:background-color .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.side .label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

.phone{width:390px;height:min(824px,calc(100dvh - 56px));min-height:660px;background:var(--frame);border-radius:54px;padding:11px;box-shadow:var(--shadow)}
.viewport{position:relative;height:100%;border-radius:44px;overflow:hidden;background:var(--bg);isolation:isolate;--sb:48px}
.sbar{position:absolute;top:0;left:0;right:0;height:48px;display:flex;justify-content:space-between;align-items:center;padding:4px 34px 0;font-size:15px;font-weight:600;z-index:40;pointer-events:none;font-variant-numeric:tabular-nums}
.sbar .sig{display:flex;gap:5px;align-items:center}
.notch{position:absolute;top:11px;left:50%;width:112px;height:32px;border-radius:999px;background:#000;transform:translateX(-50%);z-index:41}
.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--fg);opacity:.05;z-index:0}
.wm svg{width:80%}
.layers{position:absolute;inset:0;z-index:1}
.layer{position:absolute;inset:0}
.scroll{height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:calc(var(--sb) + 12px) 20px 132px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>*{flex-shrink:0}
.morph{position:absolute;z-index:35;pointer-events:none}

.info{background:var(--surface);border-radius:24px;padding:22px;box-shadow:inset 0 0 0 1px var(--line);display:grid;gap:12px;position:sticky;top:24px;min-width:0}
.info .eyebrow{color:var(--red-text)}
.info h2{font-family:var(--font-display);font-weight:800;font-size:32px;line-height:.95;text-transform:uppercase}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
.info dt{color:var(--muted)}
.info dd{margin:0;min-width:0}
.info p{font-size:14px}
.info h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}
.info ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13px}
.info ul.api{list-style:none;padding:0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--surface-2);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
.info .note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

@media (max-width:1180px){
  .stage{grid-template-columns:auto minmax(260px,320px)}
  .side{grid-column:1/-1;position:static;grid-template-columns:1fr auto;align-items:end}
  .side .screens-wrap{grid-column:1/-1}
  .screens{display:flex;overflow-x:auto;gap:6px;padding-bottom:6px;scrollbar-width:thin}
  .screens .grp{display:none}
  .screens li{flex:0 0 auto}
  .screens button{white-space:nowrap;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
}
@media (max-width:760px){
  .stage{grid-template-columns:minmax(0,1fr);gap:18px;padding-block:16px 32px}
  .side{grid-template-columns:minmax(0,1fr)}
  .phone{width:100%;max-width:440px;justify-self:center;height:calc(100dvh - 170px);min-height:600px;padding:0;border-radius:30px;background:none;box-shadow:0 0 0 1px var(--line)}
  .viewport{border-radius:30px;--sb:6px}
  .sbar,.notch{display:none}
  .info{position:static}
}

/* ---------- Tipografia do app ---------- */
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.display{font-family:var(--font-display);font-weight:900;text-transform:uppercase;line-height:.88;letter-spacing:.005em;text-wrap:balance}
.display.xl{font-size:min(76px,18vw)}
.display.lg{font-size:48px}
.display.md{font-size:38px}
.hl-red{color:var(--red)}
.lede{color:var(--muted);font-size:15px;max-width:34ch}
.sm{font-size:13px}
.tiny{font-size:12px}
.muted{color:var(--muted)}
.num{font-family:var(--font-display);font-weight:800;font-variant-numeric:tabular-nums;line-height:.9}
.num.xl{font-size:64px}
.num.lg{font-size:52px}
.num.md{font-size:34px}
.unit{font-family:var(--font-display);font-weight:800;font-size:26px;margin-left:4px}
.h2{font-size:17px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.baseline{align-items:baseline}
.stack{display:grid;gap:10px}
.center{text-align:center;justify-self:center}

/* ---------- Botões ---------- */
.btn{height:54px;border-radius:999px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;padding:0 20px;transition:transform .22s cubic-bezier(.3,.7,.4,1.5),background-color .2s,opacity .2s;position:relative}
.btn:active:not(:disabled),.press:active{transform:scale(.965)}
.press{transition:transform .22s cubic-bezier(.3,.7,.4,1.5)}
.btn.primary{background:var(--red);color:var(--on-red)}
.btn.primary:disabled{opacity:.5}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.grad{background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(90deg,var(--red),var(--orange)) border-box;border:2px solid transparent;color:var(--fg)}
.surface-ctx .btn.grad{background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(90deg,var(--red),var(--orange)) border-box}
.btn.google{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{height:42px;font-size:14px;padding:0 14px;width:auto}
.btn.danger{background:var(--surface-2);color:var(--red-text)}
.link-btn{background:none;border:0;color:var(--fg);font-weight:600;font-size:14px;padding:8px 4px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--red)}
.link-btn.end{justify-self:end}
.icon-btn{width:44px;height:44px;border-radius:999px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;flex:none}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;display:inline-block;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.shake{animation:shake .36s}

/* ---------- Marca ---------- */
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:900;font-size:20px;letter-spacing:.12em}
.brand .logo{width:28px;height:28px;color:var(--red)}
.logo .snow{fill:var(--bg)}

/* ---------- Entrada ---------- */
.hero-art{margin:-4px -20px 0;height:150px}
.hero-art svg{width:100%;height:100%;display:block}
.m-back{fill:var(--surface-2)} .m-mid{fill:var(--line)} .m-front{fill:var(--fg)} .m-snow{fill:var(--bg)}
.m-route{fill:none;stroke:var(--red);stroke-width:2;stroke-dasharray:3 5;stroke-linecap:round}
.m-flag{fill:var(--red)} .m-pole{stroke:var(--fg);stroke-width:1.5}
.vagas{background:var(--surface);border-radius:24px;padding:18px;display:grid;gap:10px;box-shadow:inset 0 0 0 1px var(--line)}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--red),var(--orange));transition:width .6s var(--ease)}
.demo{border:1px dashed var(--line);border-radius:18px;padding:10px 12px 12px;margin:0;display:grid;gap:8px}
.demo legend{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:0 6px}

/* ---------- Auth ---------- */
.auth{gap:18px}
.wave{position:absolute;left:0;right:0;top:calc(var(--sb) + 40px);width:100%;height:190px;pointer-events:none}
.auth-title{font-family:var(--font-display);font-weight:900;font-size:64px;text-transform:uppercase;line-height:.9;text-align:center;margin:30px 0 70px;position:relative}
.form{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--muted);text-align:center}
.inp{height:54px;border-radius:999px;background:var(--surface-2);border:1.5px solid transparent;padding:0 22px;width:100%;font-size:16px;text-align:center;transition:border-color .2s}
.inp:focus{outline:none;border-color:var(--red)}
.inp[aria-invalid="true"]{border-color:var(--red)}
.err{color:var(--red-text);font-size:13px;text-align:center;min-height:0}
.err:empty{display:none}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:13px;color:var(--muted)}
.check input{width:22px;height:22px;accent-color:var(--red);flex:none;margin:0}
.check a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px;cursor:pointer}
.ok-box{background:var(--surface);border-radius:24px;padding:22px;display:grid;gap:12px;text-align:center;box-shadow:inset 0 0 0 1px var(--line)}
.ok-box .ic{margin:0 auto;width:36px;height:36px;color:var(--red-text)}

/* ---------- Boas-vindas ---------- */
.avatar{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;border:0;flex:none}
.avatar.xl{width:84px;height:84px;font-size:28px;margin:0 auto}
.center-col{display:grid;gap:8px;text-align:center;justify-items:center}
.card{background:var(--surface);border-radius:24px;padding:18px;display:grid;gap:10px;box-shadow:inset 0 0 0 1px var(--line)}
.card label.lbl{font-size:13px;color:var(--muted)}
.card .inp{text-align:left}
.reveal{display:grid;gap:12px;text-align:center;justify-items:center;padding:12px 0}
.vaga-num{font-family:var(--font-display);font-weight:900;font-size:150px;line-height:.8;color:var(--red);font-variant-numeric:tabular-nums}
.vaga-num small{font-size:40px;color:var(--fg);vertical-align:top;margin-right:6px}

/* ---------- Home ---------- */
.home-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.strip-panel{background:var(--pop-bg);color:var(--pop-fg);border-radius:30px;padding:14px 12px 12px;display:grid;gap:10px}
.strip-panel .eyebrow{color:var(--pop-muted);padding:0 6px}
.strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:3px}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 46px;height:62px;border-radius:18px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:17px;scroll-snap-align:center;background:transparent;color:var(--pop-fg);font-variant-numeric:tabular-nums;transition:transform .22s cubic-bezier(.3,.7,.4,1.5)}
.chip:active{transform:scale(.92)}
.chip small{font-size:10px;font-weight:600;height:13px;display:flex;align-items:center;color:var(--pop-muted);text-transform:uppercase;letter-spacing:.06em}
.chip.ok{background:var(--red);color:var(--on-red)}
.chip.ok small{color:var(--on-red)}
.chip.miss{color:var(--pop-muted)}
.chip.hoje{box-shadow:inset 0 0 0 2px var(--red)}
.chip.ok.hoje{box-shadow:inset 0 0 0 2px var(--pop-fg)}
.chip.futuro{opacity:.4}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-20px;padding-inline:20px;scroll-padding-inline:20px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.hl{flex:0 0 100%;scroll-snap-align:start;border-radius:30px;padding:20px;min-height:196px;position:relative;overflow:hidden;display:grid;align-content:start;gap:6px}
.hl.red{background:var(--red);color:var(--on-red)}
.hl.red .eyebrow{color:var(--on-red);opacity:.85}
.hl.red .sub{opacity:.9}
.hl .prize{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;margin-top:auto;position:relative;z-index:1;max-width:23ch}
.hl-mtn{position:absolute;right:-14px;bottom:-8px;width:62%;height:auto}
.hl-mtn .a{fill:rgba(0,0,0,.18)} .hl-mtn .b{fill:rgba(255,255,255,.16)}
.hl-mtn .p{fill:none;stroke:rgba(255,255,255,.95);stroke-width:3;stroke-linecap:round}
.hl-mtn .d{fill:#fff}
.hl.outline{background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(120deg,var(--red),var(--orange)) border-box;border:2px solid transparent}
.hl-title{font-size:21px;font-weight:600;line-height:1.25;margin:4px 0 12px;max-width:22ch}
.hl-title b{color:var(--red-text)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:-4px}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--line);transition:width .3s var(--ease),background-color .3s}
.dots i.on{width:18px;background:var(--red)}
.today{background:var(--surface);border-radius:28px;padding:18px;display:grid;gap:12px;text-align:left;border:0;box-shadow:inset 0 0 0 1px var(--line);position:relative;width:100%}
.today .go{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:999px;background:var(--red);color:var(--on-red);display:grid;place-items:center}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.segs i{height:8px;border-radius:99px;background:var(--surface-2);transition:background-color .35s var(--ease)}
.segs i.on{background:var(--red)}
.todo{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface-2);display:inline-flex;gap:5px;align-items:center}
.tag.ok{color:var(--red-text)}
.sec{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pop{background:var(--pop-bg);color:var(--pop-fg);border-radius:28px;padding:16px;display:grid;gap:8px;align-content:start;text-align:left;border:0;position:relative;min-width:0}
.pop .tiny{color:var(--pop-muted)}
.pop .bar{background:var(--pop-track)}
.avs{display:flex;margin-top:2px}
.avs .avatar{width:30px;height:30px;font-size:11px;box-shadow:0 0 0 2px var(--pop-bg);margin-right:-8px}
.round{width:36px;height:36px;border-radius:999px;background:var(--pop-fg);color:var(--pop-bg);display:grid;place-items:center;margin-top:4px}
.dock{position:absolute;left:0;right:0;bottom:84px;padding:22px 20px 8px;background:linear-gradient(to top,var(--bg) 58%,transparent);z-index:5}

/* ---------- Tab bar ---------- */
.tabbar{position:absolute;left:14px;right:14px;bottom:14px;height:64px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),0 12px 30px -12px rgba(0,0,0,.35);display:flex;padding:6px;z-index:20;transition:transform .42s var(--ease),opacity .3s}
.tabbar.off{transform:translateY(120%);opacity:0;pointer-events:none}
.tab-ind{position:absolute;top:6px;left:0;height:52px;border-radius:999px;background:var(--red);transition:transform .42s cubic-bezier(.3,.8,.3,1.15),width .42s var(--ease)}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);position:relative;z-index:1;border-radius:999px;transition:color .3s}
.tab[aria-current="page"]{color:var(--on-red)}

/* ---------- Check-in ---------- */
.topbar{display:flex;align-items:center;gap:12px}
.topbar .t{flex:1;min-width:0}
.save{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
.notice{display:flex;gap:10px;align-items:center;background:var(--surface-2);border-radius:16px;padding:12px 14px;font-size:13px}
.sum{background:var(--surface);border-radius:24px;padding:16px;display:grid;gap:12px;box-shadow:inset 0 0 0 1px var(--line)}
.done-banner{display:flex;gap:12px;align-items:center;background:var(--red);color:var(--on-red);border-radius:18px;padding:12px 14px}

const completo = () => reqs(S.hoje).every(Boolean);
const concluidos = () => DONE.size + (completo() ? 1 : 0);
const altitude = d => Math.round(d / 30 * 8848);
function statusDia(n){
  if (n === S.dia) return completo() ? 'ok hoje' : 'hoje';
  if (n > S.dia) return 'futuro';
  return DONE.has(n) ? 'ok' : 'miss';
}
function sequencias(){
  const arr = [];
  for (let n = 1; n <= 30; n++) arr.push(n < S.dia ? DONE.has(n) : n === S.dia ? completo() : false);
  let best = 0, cur = 0;
  arr.forEach(v => { cur = v ? cur + 1 : 0; best = Math.max(best, cur); });
  let i = S.dia - 1; if (!arr[i]) i--;
  let atual = 0; while (i >= 0 && arr[i]) { atual++; i--; }
  return { best, atual };
}
function nomeExib(s){
  const p = s.trim().split(/\s+/).filter(Boolean);
  if (!p.length) return '';
  const cap = w => w[0].toUpperCase() + w.slice(1).toLowerCase();
  return p.length === 1 ? cap(p[0]) : `${cap(p[0])} ${p[p.length - 1][0].toUpperCase()}.`;
}
const iniciais = s => { const p = s.trim().split(/\s+/); return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); };
const av = (p, cls = '') => `<span class="avatar ${cls}" style="background:${AV_COLORS[p.cor % AV_COLORS.length]}" aria-hidden="true">${iniciais(p.nome)}</span>`;
function ranking(){
  const s = sequencias();
  const list = PEOPLE.map(p => p.me ? { ...p, dias:concluidos(), best:s.best, atual:s.atual } : p);
  list.sort((a, b) => (b.dias - a.dias) || (b.best - a.best) || (b.atual - a.atual) || (a.vaga - b.vaga));
  return list.map((p, i) => ({ ...p, pos:i + 1 }));
}

/* Admin: status por participante (ok, miss, rev = aguardando conferência, invalido) */
const ADM = {}, MOTIVO = {};
function admStatus(id){
  if (ADM[id]) return ADM[id];
  const p = PEOPLE.find(x => x.id === id);
  const arr = [];
  if (p.me){
    for (let n = 1; n <= 30; n++) arr.push(n < S.dia ? (DONE.has(n) ? 'ok' : 'miss') : n === S.dia ? 'hoje' : 'futuro');
  } else {
    const misses = 16 - p.dias, missSet = new Set();
    for (let k = 0; k < misses; k++) missSet.add(1 + Math.floor((k + 1) * 15 / (misses + 1)));
    for (let n = 1; n <= 30; n++) arr.push(n < S.dia ? (missSet.has(n) ? 'miss' : 'ok') : n === S.dia ? 'hoje' : 'futuro');
    let r = p.rev || 0;
    for (let n = 16; n >= 1 && r > 0; n--) if (arr[n - 1] === 'ok') { arr[n - 1] = 'rev'; r--; }
  }
  if (id === 'rafael'){ arr[8] = 'invalido'; MOTIVO['rafael-9'] = 'A foto da leitura era a mesma do dia 8.'; }
  return (ADM[id] = arr);
}
const revCount = id => admStatus(id).filter(s => s === 'rev').length;

function chip(n){
  const st = statusDia(n);
  const lbl = { ok:'concluído', 'ok hoje':'hoje, concluído', miss:'não concluído', hoje:'hoje', futuro:'ainda não abriu' }[st];
  const attrs = st === 'futuro' ? `data-act="futuro" data-n="${n}"` : `data-expand="dia" data-day="${n}"`;
  const top = st.startsWith('ok') ? ic('check','xs') : st === 'hoje' ? 'hoje' : st === 'miss' ? '×' : '';
  return `<button class="chip ${st}" ${attrs} aria-label="Dia ${n}, ${lbl}"><small>${top}</small>${n}</button>`;
}

}

function slotHTML(tipo, f, ed){
  const lbl = TIPO_LBL[tipo];
  if (!f) return ed
    ? `<label class="slot empty press" for="f-${tipo}"><input class="vh" type="file" accept="image/*" id="f-${tipo}" data-foto="${tipo}">${ic(TIPO_IC[tipo])}<span>${lbl}</span><small>Adicionar foto</small></label>`
    : `<div class="slot empty" style="cursor:default">${ic(TIPO_IC[tipo])}<span>${lbl}</span><small>Sem foto</small></div>`;
  return `<div class="slot"><img src="${f.src}" alt="Foto de prova: ${lbl}">${f.status === 'proc' ? '<span class="slot-st"><i class="spin"></i>Enviando</span>' : `<span class="slot-tag">${ic('check','xs')} ${lbl}</span>`}${ed ? `<button class="slot-x" data-act="rm-foto" data-tipo="${tipo}" aria-label="Remover foto de ${lbl}">${ic('x')}</button>` : ''}</div>`;
}
function badge(el, ok, txt){
  if (!el) return;
  el.className = 'badge' + (ok ? ' ok' : '');
  el.innerHTML = ok ? ic('check','xs') + ' Feito' : txt;
}
function refreshDia(el, animateDone){
  const root = $('#dia-root', el); if (!root) return;
  const n = S.viewDia, ed = n === S.dia, D = ed ? S.hoje : pastData(n);
  const r = reqs(D), k = r.filter(Boolean).length;
  $('#sum-n', root).textContent = k;
  $$('#segs i', root).forEach((s, i) => s.classList.toggle('on', i < k));
  $('#v-agua', root).textContent = fmt(D.agua);
  $('#bar-agua', root).style.width = Math.min(100, D.agua / 30) + '%';
  badge($('#b0', root), r[0], `Faltam ${fmt(Math.max(0, 3000 - D.agua))} ml`);
  $('#t-exe', root).setAttribute('aria-checked', String(!!D.exercicio));
  badge($('#b1', root), r[1], 'Pendente');
  $('#v-pag', root).textContent = D.paginas;
  badge($('#b2', root), r[2], `Faltam ${10 - D.paginas} pág.`);
  $('#slots', root).innerHTML = TIPOS.map(t => slotHTML(t, D.fotos[t], ed)).join('');
  badge($('#b3', root), r[3], `${fotosN(D)} de 3`);
  $('#t-story', root).setAttribute('aria-checked', String(!!D.story));
  badge($('#b4', root), r[4], 'Pendente');
  r.forEach((ok, i) => $('#r' + i, root).classList.toggle('done', ok));
  const banner = $('#done', root), was = !banner.hidden;
  banner.hidden = k !== 5;
  if (k === 5 && !was && animateDone && !RM){
    banner.classList.remove('play'); void banner.offsetWidth; banner.classList.add('play');
    banner.animate([{ opacity:0, transform:'translateY(8px) scale(.96)' }, { opacity:1, transform:'none' }], { duration:420, easing:EASE });
  }
}

function admPanel(id){

  const fotos = full ? TIPOS : s === 'miss' ? ['AGUA'] : [];
  const pill = { ok:'<span class="mini alt">Conferido</span>', rev:'<span class="flag">Aguardando conferência</span>', invalido:'<span class="mini">Invalidado</span>', miss:'<span class="mini alt">Incompleto</span>', hoje:'<span class="mini alt">Em andamento</span>' }[s] || '';
  const vals = full ? [['Água','3.250 ml'],['Exercício','Sim'],['Leitura','12 páginas'],['Story','Postado']] : s === 'miss' ? [['Água','2.000 ml'],['Exercício','Sim'],['Leitura','4 páginas'],['Story','Não']] : [['Água','1.000 ml'],['Exercício','Não'],['Leitura','0 páginas'],['Story','Não']];
  let acoes = '';
  if (s === 'invalido') acoes = `<div class="inval"><b style="color:var(--red-text)">Invalidado pelo embaixador</b><span>${MOTIVO[id + '-' + n] || ''}</span></div><button class="btn ghost" data-act="adm-reval">Revalidar dia</button>`;
  else if ((s === 'ok' || s === 'rev') && S.admForm) acoes = `<label class="lbl sm muted" for="adm-motivo">Motivo (o participante vai ver)</label><textarea class="inp" id="adm-motivo" placeholder="Ex.: a foto da leitura é a mesma de ontem"></textarea><div class="row"><button class="btn ghost" data-act="adm-cancel">Cancelar</button><button class="btn primary" id="adm-ok" data-act="adm-inval-ok" disabled>Invalidar</button></div>`;
  else if (s === 'rev') acoes = `<div class="row"><button class="btn danger" data-act="adm-inval">Invalidar</button><button class="btn primary" data-act="adm-aprovar">${ic('check','sm')} Aprovar</button></div>`;
  else if (s === 'ok') acoes = `<button class="btn danger" data-act="adm-inval">Invalidar dia</button>`;
  return `<div class="row between"><h2 class="h2">Dia ${n}</h2>${pill}</div>
    ${fotos.length ? `<div class="slots">${fotos.map(t => `<div class="slot"><img src="${fotoFake(t)}" alt="Prova: ${TIPO_LBL[t]}"><span class="slot-tag">${TIPO_LBL[t]}</span></div>`).join('')}</div>` : '<p class="sm muted">Sem fotos enviadas ainda.</p>'}

/* ---------- Navegação ---------- */
const vp = $('#vp'), layers = $('#layers'), info = $('#info'), screensEl = $('#screens');
let current = null, curId = null, curPrev = null, pending = null;

const tabbar = document.createElement('nav');
tabbar.className = 'tabbar off'; tabbar.setAttribute('aria-label', 'Navegação do app');
tabbar.innerHTML = '<span class="tab-ind" aria-hidden="true"></span>' + [['desafio','flag','Desafio'],['progresso','chart','Progresso'],['ranking','trophy','Ranking'],['perfil','user','Perfil']].map(([id, i, l]) => `<button class="tab" data-tab="${id}" data-go="${id}" data-trans="fade">${ic(i)}<span>${l}</span></button>`).join('');

function updateChrome(id){
  const show = TABS.includes(id);
  tabbar.classList.toggle('off', !show);
  $$('.tab', tabbar).forEach(b => { if (b.dataset.tab === id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });

function stagger(el){
  $$('.rise', el).forEach((n, i) => n.animate([{ opacity:0, transform:'translateY(14px)' }, { opacity:1, transform:'none' }], { duration:440, delay:70 + i * 40, easing:EASE, fill:'backwards' }));
}
function countUps(el){
  $$('[data-count]', el).forEach(n => {
    const to = +n.dataset.count; if (RM || !to){ n.textContent = fmt(to); return; }
    const t0 = performance.now(), dur = 800;
    const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); n.textContent = fmt(Math.round(to * e)); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  $$('[data-w]', el).forEach(b => { b.style.width = '0%'; requestAnimationFrame(() => requestAnimationFrame(() => { b.style.width = b.dataset.w + '%'; })); });
}

function render(id, trans = 'fade'){
  if (!SCREENS[id]) id = 'entrada';
  curPrev = curId;
  const layer = document.createElement('section');
  layer.className = 'layer'; layer.dataset.screen = id; layer.setAttribute('aria-label', RMAP[id].nome);
  layer.innerHTML = SCREENS[id].html();
  layers.appendChild(layer);
  const old = current; current = layer; curId = id;
  if (SCREENS[id].mount) SCREENS[id].mount(layer);
  updateChrome(id);
  if (old){
    old.style.pointerEvents = 'none'; old.setAttribute('aria-hidden', 'true');
    if (RM || trans === 'none') old.remove();
    else {
      const dx = trans === 'push' ? '-18px' : trans === 'back' ? '24px' : '0px';
      old.animate([{ opacity:1, transform:'none' }, { opacity:0, transform:`translateX(${dx})` }], { duration:170, easing:'ease-in', fill:'forwards' }).onfinish = () => old.remove();
    }
  }
  if (!RM && trans !== 'none'){
    const from = { push:'translateX(30px)', back:'translateX(-30px)', fade:'translateY(10px)' }[trans] || 'translateY(10px)';
    layer.animate([{ opacity:0, transform:from }, { opacity:1, transform:'none' }], { duration:320, delay:old ? 70 : 0, easing:EASE, fill:'backwards' });
  }
  if (!RM) stagger(layer);
  countUps(layer);
}
function go(id, trans = 'push'){
  if (id === 'dia' && curId !== 'desafio') S.viewDia = S.viewDia || S.dia;
  if (id === curId){ render(id, trans); return; }
  pending = trans;
  if (location.hash.slice(1) === id) render(id, trans);
  else location.hash = id;
}
function goNow(id, trans){
  render(id, trans);
  if (location.hash.slice(1) !== id) location.hash = id;
}
addEventListener('hashchange', () => {
  const h = location.hash.slice(1) || 'entrada';
  if (h === curId) return;
  render(h, pending || 'fade'); pending = null;
});

/* Card que abre e vira a tela (container transform) */
function expand(el, id){
  if (RM){ go(id, 'fade'); return; }
  const v = vp.getBoundingClientRect(), r = el.getBoundingClientRect(), cs = getComputedStyle(el), vs = getComputedStyle(vp);
  let bg = cs.backgroundColor;
  if (!bg || bg === 'rgba(0, 0, 0, 0)' || bg === 'transparent') bg = vs.backgroundColor;
  const from = { left:(r.left - v.left) + 'px', top:(r.top - v.top) + 'px', width:r.width + 'px', height:r.height + 'px', borderRadius:cs.borderTopLeftRadius, backgroundColor:bg };
  const to = { left:'0px', top:'0px', width:v.width + 'px', height:v.height + 'px', borderRadius:vs.borderTopLeftRadius, backgroundColor:vs.backgroundColor };
  const ov = document.createElement('div'); ov.className = 'morph'; Object.assign(ov.style, from); vp.appendChild(ov);
  el.animate([{ transform:'scale(1)' }, { transform:'scale(.97)' }, { transform:'scale(1)' }], { duration:200 });
  if (current) current.animate([{ opacity:1 }, { opacity:.35 }], { duration:380, fill:'forwards' });
  ov.animate([from, to], { duration:460, easing:EASE, fill:'forwards' }).onfinish = () => {
    goNow(id, 'none');
    ov.animate([{ opacity:1 }, { opacity:0 }], { duration:240, easing:'ease-out', fill:'forwards' }).onfinish = () => ov.remove();
  };
}

/* ---------- Toast e folha ---------- */
function toast(msg){
  $$('.toast', vp).forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; vp.appendChild(t);
  if (!RM) t.animate([{ opacity:0, transform:'translate(-50%,-10px)' }, { opacity:1, transform:'translate(-50%,0)' }], { duration:260, easing:EASE });
  setTimeout(() => { const a = t.animate([{ opacity:1 }, { opacity:0 }], { duration:RM ? 1 : 220, fill:'forwards' }); a.onfinish = () => t.remove(); }, 2400);
}
function openSheet(html){

function closeSheet(now){

}

  if (ex && !ex.disabled){ e.preventDefault(); if (ex.dataset.day) S.viewDia = +ex.dataset.day; expand(ex, ex.dataset.expand); return; }
  const g = t.closest('[data-go]');
  if (g && !g.disabled){ e.preventDefault(); go(g.dataset.go, g.dataset.trans || 'push'); return; }
  const a = t.closest('[data-act]');
  if (a && !a.disabled && ACT[a.dataset.act]) ACT[a.dataset.act](a, e);
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'bv-nome'){ const p = $('#bv-prev', current); if (p) p.textContent = nomeExib(e.target.value) || 'preencha seu nome'; }
  if (id === 'adm-busca'){ const q = e.target.value.trim().toLowerCase(); $$('#adm-list .prow', current).forEach(r => { r.hidden = q && !r.dataset.busca.includes(q); }); }
  if (id === 'adm-motivo'){ const b = $('#adm-ok', current); if (b) b.disabled = e.target.value.trim().length < 5; }
});
document.addEventListener('change', e => {
  const inp = e.target; if (!inp.dataset || !inp.dataset.foto) return;
  const file = inp.files && inp.files[0], tipo = inp.dataset.foto; if (!file) return;
  if (!/^image\//.test(file.type)){ toast('Escolha uma imagem JPG, PNG ou WEBP.'); inp.value = ''; return; }
  const rd = new FileReader();
  rd.onload = () => {
    mudouHoje(() => { S.hoje.fotos[tipo] = { src:rd.result, status:'proc' }; });
    setTimeout(() => { if (S.hoje.fotos[tipo]){ S.hoje.fotos[tipo].status = 'ok'; if (curId === 'dia') refreshDia(current, false); } }, 1200);
  };
  rd.readAsDataURL(file);
});
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); FORM[f.dataset.form](f); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('.sheet', vp)) closeSheet(); });
addEventListener('resize', () => { if (curId) { const b = $(`[data-tab="${curId}"]`, tabbar); if (b){ ind.style.width = b.offsetWidth + 'px'; ind.style.transform = `translateX(${b.offsetLeft}px)`; } } });

/* ---------- Início ---------- */
let saved0 = 'sistema';
try { saved0 = localStorage.getItem('everest-tema') || 'sistema'; } catch (e) {}
applyTema(saved0, false);
render(SCREENS[location.hash.slice(1)] ? location.hash.slice(1) : 'entrada', 'fade');
})();
</script>
