name: everest-desafio

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: everest
      POSTGRES_PASSWORD: everest
      POSTGRES_DB: everest
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U everest -d everest']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # A MinIO parou de publicar imagens oficiais no Docker Hub/Quay (2025).
  # Usamos a build congelada da Bitnami (bitnamilegacy) — só para desenvolvimento.
  minio:
    image: bitnamilegacy/minio:2025.5.24
    environment:
      MINIO_ROOT_USER: everest
      MINIO_ROOT_PASSWORD: everest-dev-secret
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173,http://localhost:4173,http://localhost:4174
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: bitnamilegacy/minio-client:2025.5.21
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 everest everest-dev-secret &&
      mc mb --ignore-existing local/everest-provas &&
      mc anonymous set none local/everest-provas &&
      echo 'bucket everest-provas pronto (privado)'
      "
    restart: 'no'

volumes:
  pgdata:
  miniodata:
